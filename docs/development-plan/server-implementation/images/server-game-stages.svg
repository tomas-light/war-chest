<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
  <title id="title">Этапы реализации игрового server</title>
  <desc id="description">Последовательность от игрового репозитория до reconnect и восстановления.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <style>
      .heading { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .stage { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .detail { font: 14px Arial, sans-serif; fill: #334155; }
      .box { stroke: #64748b; stroke-width: 2; rx: 12; }
      .arrow { stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="390" fill="#ffffff" />
  <text x="40" y="48" class="heading">Игровой server: последовательность этапов 4–8</text>

  <rect x="40" y="105" width="200" height="165" class="box" fill="#dbeafe" />
  <text x="60" y="140" class="stage">4. Repository</text>
  <text x="60" y="176" class="detail">PostgreSQL-транзакции</text>
  <text x="60" y="200" class="detail">commandId и version</text>
  <text x="60" y="224" class="detail">events и проекции</text>

  <line x1="240" y1="188" x2="280" y2="188" class="arrow" />
  <rect x="280" y="105" width="200" height="165" class="box" fill="#dcfce7" />
  <text x="300" y="140" class="stage">5. Game service</text>
  <text x="300" y="176" class="detail">ActiveGame и replay</text>
  <text x="300" y="200" class="detail">decide → save → apply</text>
  <text x="300" y="224" class="detail">safe views</text>

  <line x1="480" y1="188" x2="520" y2="188" class="arrow" />
  <rect x="520" y="105" width="200" height="165" class="box" fill="#fef3c7" />
  <text x="540" y="140" class="stage">6. HTTP API</text>
  <text x="540" y="176" class="detail">create, join, start</text>
  <text x="540" y="200" class="detail">snapshot и history</text>
  <text x="540" y="224" class="detail">session и Zod</text>

  <line x1="720" y1="188" x2="760" y2="188" class="arrow" />
  <rect x="760" y="105" width="200" height="165" class="box" fill="#f3e8ff" />
  <text x="780" y="140" class="stage">7. Socket.IO</text>
  <text x="780" y="176" class="detail">commands и sync</text>
  <text x="780" y="200" class="detail">персональные события</text>
  <text x="780" y="224" class="detail">rooms</text>

  <line x1="960" y1="188" x2="1000" y2="188" class="arrow" />
  <rect x="1000" y="105" width="160" height="165" class="box" fill="#fee2e2" />
  <text x="1020" y="140" class="stage">8. Recovery</text>
  <text x="1020" y="176" class="detail">disconnect deadline</text>
  <text x="1020" y="200" class="detail">defeat и timers</text>
  <text x="1020" y="224" class="detail">restart replay</text>

  <text x="40" y="330" class="detail">Общий инвариант: событие применяется к состоянию и рассылается только после успешного commit.</text>
</svg>
