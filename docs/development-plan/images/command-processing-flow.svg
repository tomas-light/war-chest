<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title description">
  <title id="title">Цикл обработки игровой команды</title>
  <desc id="description">Схема показывает порядок decide, сохранения событий и applyEvent, а также фиксацию feature flags при создании игры.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .section { font: 700 21px Arial, sans-serif; fill: #334155; }
      .label { font: 700 17px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .text { font: 15px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .small { font: 14px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 12; }
      .decision { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; rx: 12; }
      .event { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; rx: 12; }
      .storage { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; rx: 12; }
      .state { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; rx: 12; }
      .error { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; rx: 12; }
      .start-band { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="920" fill="#ffffff"/>
  <text x="750" y="52" class="title" text-anchor="middle">Как команда превращается в новое состояние</text>

  <text x="48" y="104" class="section">Обычный цикл команды</text>

  <rect x="45" y="145" width="220" height="88" class="state"/>
  <text x="155" y="177" class="label">Текущий GameState</text>
  <text x="155" y="205" class="text">lastEventSequence = N</text>

  <rect x="45" y="275" width="220" height="88" class="box"/>
  <text x="155" y="307" class="label">GameCommandData</text>
  <text x="155" y="335" class="text">намерение игрока</text>

  <path d="M265 189 H330 V218 H380" class="arrow"/>
  <path d="M265 319 H330 V254 H380" class="arrow"/>

  <rect x="380" y="165" width="250" height="120" class="decision"/>
  <text x="505" y="198" class="label">decide(...)</text>
  <text x="505" y="228" class="text">hydrateCommand(data)</text>
  <text x="505" y="252" class="small">command.decide(state, playerId)</text>

  <path d="M505 285 V335" class="arrow"/>
  <rect x="380" y="350" width="250" height="92" class="error"/>
  <text x="505" y="382" class="label">Команда отклонена</text>
  <text x="505" y="409" class="text">событий нет</text>
  <text x="505" y="430" class="small">состояние не меняется</text>
  <text x="555" y="325" class="small">ошибка</text>

  <path d="M630 225 H705" class="arrow"/>
  <text x="667" y="209" class="small">успех</text>

  <rect x="705" y="165" width="220" height="120" class="event"/>
  <text x="815" y="198" class="label">GameEventData[]</text>
  <text x="815" y="228" class="text">предложенные факты</text>
  <text x="815" y="252" class="small">состояние ещё старое</text>

  <path d="M925 225 H1000" class="arrow"/>

  <rect x="1000" y="165" width="220" height="120" class="storage"/>
  <text x="1110" y="198" class="label">Транзакция</text>
  <text x="1110" y="228" class="text">сохранение событий</text>
  <text x="1110" y="252" class="small">PostgreSQL</text>

  <path d="M1220 225 H1270" class="arrow"/>

  <rect x="1270" y="165" width="185" height="120" class="decision"/>
  <text x="1362" y="198" class="label">applyEvent</text>
  <text x="1362" y="228" class="text">применяет каждый</text>
  <text x="1362" y="252" class="text">сохранённый факт</text>

  <path d="M1362 285 V350" class="arrow"/>
  <rect x="1252" y="365" width="220" height="92" class="state"/>
  <text x="1362" y="397" class="label">Новый GameState</text>
  <text x="1362" y="423" class="small">lastEventSequence =</text>
  <text x="1362" y="444" class="small">N + events.length</text>

  <path d="M1252 411 H1180 V495 H20 V189 H45" class="dashed"/>
  <text x="715" y="485" class="small">следующая команда получает это состояние как текущее</text>

  <rect x="45" y="545" width="1410" height="315" class="start-band"/>
  <text x="75" y="590" class="section">Особый вход только при создании игры</text>

  <rect x="75" y="635" width="230" height="102" class="box"/>
  <text x="190" y="668" class="label">Runtime-файл</text>
  <text x="190" y="696" class="text">актуальные feature flags</text>
  <text x="190" y="720" class="small">читает сервер</text>

  <path d="M305 686 H365" class="arrow"/>

  <rect x="365" y="625" width="260" height="122" class="decision"/>
  <text x="495" y="657" class="label">Доверенная CreateGame</text>
  <text x="495" y="685" class="text">сервер добавляет flags</text>
  <text x="495" y="709" class="small">клиент их не присылает</text>

  <path d="M625 686 H685" class="arrow"/>

  <rect x="685" y="625" width="220" height="122" class="decision"/>
  <text x="795" y="657" class="label">createGame(...)</text>
  <text x="795" y="685" class="text">создаёт GameCreated</text>
  <text x="795" y="709" class="small">с snapshot флагов</text>

  <path d="M905 686 H965" class="arrow"/>

  <rect x="965" y="625" width="220" height="122" class="storage"/>
  <text x="1075" y="657" class="label">Сохранение</text>
  <text x="1075" y="685" class="text">GameCreated</text>
  <text x="1075" y="709" class="small">становится фактом истории</text>

  <path d="M1185 686 H1245" class="arrow"/>

  <rect x="1245" y="625" width="180" height="122" class="state"/>
  <text x="1335" y="657" class="label">applyEvent</text>
  <text x="1335" y="685" class="text">создаёт GameState</text>
  <text x="1335" y="709" class="small">из null и GameCreated</text>

  <text x="750" y="810" class="text">Только последующие команды читают feature flags из текущего GameState.</text>
  <text x="750" y="835" class="small">При replay выполняется цепочка GameEventData → hydrateEvent → event.apply; decide не вызывается.</text>
</svg>
