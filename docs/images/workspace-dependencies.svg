<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title description">
  <title id="title">Зависимости приложений и пакетов War Chest</title>
  <desc id="description">Схема показывает текущие и запланированные workspace-зависимости между приложениями web и server и пакетами game-engine, fake-database, auth, database и config.</desc>

  <defs>
    <marker id="arrow-current" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-planned" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .subtitle { font: 16px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .group-title { font: 700 20px Arial, sans-serif; fill: #334155; }
      .node-title { font: 700 20px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-path { font: 15px Consolas, monospace; fill: #475569; text-anchor: middle; }
      .node-text { font: 15px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .small { font: 14px Arial, sans-serif; fill: #475569; }
      .edge-label { font: 14px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 20; }
      .app { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; rx: 16; }
      .engine { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; rx: 16; }
      .fake { fill: #fffbeb; stroke: #d97706; stroke-width: 2.5; rx: 16; }
      .auth { fill: #f0fdfa; stroke: #0f766e; stroke-width: 2.5; rx: 16; }
      .database { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; rx: 16; }
      .config { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; rx: 16; }
      .current { fill: none; stroke: #1e293b; stroke-width: 3; marker-end: url(#arrow-current); }
      .planned { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow-planned); }
      .label-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8; }
      .chip { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1440" height="1040" fill="#ffffff"/>

  <text x="720" y="54" class="title">Зависимости приложений и пакетов</text>
  <text x="720" y="84" class="subtitle">Стрелка A → B означает, что A использует B</text>

  <path d="M405 119 H495" class="current"/>
  <text x="515" y="124" class="small">объявлено сейчас</text>
  <path d="M720 119 H810" class="planned"/>
  <text x="830" y="124" class="small">зафиксировано в плане</text>

  <rect x="45" y="155" width="390" height="790" class="group"/>
  <text x="75" y="194" class="group-title">Приложения</text>

  <rect x="495" y="155" width="900" height="790" class="group"/>
  <text x="525" y="194" class="group-title">Переиспользуемые пакеты</text>

  <rect x="90" y="240" width="300" height="150" class="app"/>
  <text x="240" y="278" class="node-title">Web</text>
  <text x="240" y="306" class="node-path">apps/web</text>
  <text x="240" y="338" class="node-text">React-клиент</text>
  <text x="240" y="362" class="node-text">real и fake backend</text>

  <rect x="90" y="555" width="300" height="150" class="app"/>
  <text x="240" y="593" class="node-title">Server</text>
  <text x="240" y="621" class="node-path">apps/server</text>
  <text x="240" y="653" class="node-text">авторитетная игра</text>
  <text x="240" y="677" class="node-text">HTTP и Socket.IO</text>

  <rect x="760" y="205" width="330" height="145" class="engine"/>
  <text x="925" y="243" class="node-title">Game Engine</text>
  <text x="925" y="271" class="node-path">packages/game-engine</text>
  <text x="925" y="303" class="node-text">правила, команды, события</text>
  <text x="925" y="327" class="node-text">и безопасные представления</text>

  <rect x="760" y="385" width="330" height="145" class="fake"/>
  <text x="925" y="423" class="node-title">Fake Database</text>
  <text x="925" y="451" class="node-path">packages/fake-database</text>
  <text x="925" y="483" class="node-text">browser-only IndexedDB</text>
  <rect x="865" y="497" width="120" height="24" class="chip"/>
  <text x="925" y="514" class="small" text-anchor="middle">npm: idb</text>

  <rect x="560" y="585" width="330" height="145" class="auth"/>
  <text x="725" y="623" class="node-title">Auth</text>
  <text x="725" y="651" class="node-path">packages/auth</text>
  <text x="725" y="683" class="node-text">OAuth-провайдеры</text>
  <text x="725" y="707" class="node-text">и сессии War Chest</text>

  <rect x="1030" y="585" width="330" height="145" class="database"/>
  <text x="1195" y="623" class="node-title">Database</text>
  <text x="1195" y="651" class="node-path">packages/database</text>
  <text x="1195" y="683" class="node-text">PostgreSQL, схема</text>
  <text x="1195" y="707" class="node-text">и миграции</text>

  <rect x="795" y="775" width="330" height="120" class="config"/>
  <text x="960" y="813" class="node-title">Config</text>
  <text x="960" y="841" class="node-path">packages/config</text>
  <text x="960" y="873" class="node-text">YAML-файлы и process env</text>

  <path d="M390 276 C515 276 600 247 760 247" class="current"/>
  <rect x="515" y="237" width="142" height="27" class="label-bg"/>
  <text x="586" y="256" class="edge-label">общие правила</text>

  <path d="M390 350 H610 V457 H760" class="planned"/>
  <rect x="493" y="337" width="176" height="27" class="label-bg"/>
  <text x="581" y="356" class="edge-label">только development</text>

  <path d="M390 575 H475 V315 H760" class="current"/>
  <rect x="404" y="421" width="142" height="27" class="label-bg"/>
  <text x="475" y="440" class="edge-label">проверка команд</text>

  <path d="M390 630 H560" class="planned"/>
  <rect x="413" y="596" width="124" height="27" class="label-bg"/>
  <text x="475" y="615" class="edge-label">HTTP-адаптер</text>

  <path d="M890 657 H1030" class="current"/>
  <rect x="906" y="623" width="108" height="27" class="label-bg"/>
  <text x="960" y="642" class="edge-label">сессии</text>

  <path d="M1090 457 H1280 V585" class="current"/>
  <rect x="1110" y="443" width="160" height="27" class="label-bg"/>
  <text x="1190" y="462" class="edge-label">типы (type-only)</text>

  <path d="M725 730 V835 H795" class="current"/>
  <path d="M1195 730 V835 H1125" class="current"/>

  <path d="M240 705 V920 H1335 V730" class="planned"/>
  <rect x="561" y="907" width="318" height="27" class="label-bg"/>
  <text x="720" y="926" class="edge-label">игровые репозитории и транзакции</text>

  <text x="720" y="990" class="subtitle">HTTP и Socket.IO между Web и Server — runtime-взаимодействие и здесь не показаны.</text>
</svg>
