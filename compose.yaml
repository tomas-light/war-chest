services:
  playwright:
    build:
      context: .
      dockerfile: docker/playwright/Dockerfile
    environment:
      CI: 'true'
      DATABASE_URL: postgresql://war_chest:war_chest@postgres:5432/war_chest
    init: true
    ipc: host
    volumes:
      - .:/source:ro
      - yarn-cache:/root/.yarn/berry
    working_dir: /workspace

  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-war_chest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-war_chest}
      POSTGRES_USER: ${POSTGRES_USER:-war_chest}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  yarn-cache:
